name: stock-analysis

on:
  push:
    paths: ["projects/stock-analysis/**", ".github/workflows/stock-analysis.yml"]
  pull_request:
    paths: ["projects/stock-analysis/**", ".github/workflows/stock-analysis.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stock-analysis/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stock-analysis/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/stock-analysis/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
